[package]
name = "shadcn-gallery"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
web-time = "1.1.0"
yakui-shadcn = { path = "../shadcn" }
yakui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[bin]]
name = "compare"
path = "src/compare.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }
yakui-app.workspace = true
yakui-to-image.workspace = true
winit = "0.30.13"
wgpu = "30.0.0"
pollster = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
yakui-wgpu.workspace = true
wgpu = { version = "30.0.0", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "DomRect",
    "Event", "EventTarget", "PointerEvent", "KeyboardEvent", "WheelEvent",
    "UrlSearchParams", "Location", "console", "Navigator", "Clipboard",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[build-dependencies]
syn = { version = "2", features = ["full", "fold", "visit"] }
quote = "1"
prettyplease = "0.2"
proc-macro2 = "1"
