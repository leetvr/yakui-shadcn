[package]
name = "adequate-gallery"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
yakui-adequate-ui = { path = "../adequate-ui" }
yakui.workspace = true
yakui-app.workspace = true
yakui-to-image.workspace = true
winit = "0.30.13"
wgpu = "30.0.0"
pollster = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "compare"
path = "src/compare.rs"
